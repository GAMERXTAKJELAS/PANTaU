<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PANTaU — Pemantauan Aktiviti Nadi dan TekAnan dalam Unit">
  <title>PANTaU — Log In</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="auth">
    <div class="auth-card">

      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
          <polyline points="6.5 12 9.5 12 11 9 13 15 14.5 12 17.5 12"/>
        </svg>
        <div>
          <div class="brand__name">PANTaU</div>
          <p class="tagline">Pemantauan Aktiviti Nadi dan TekAnan dalam Unit</p>
        </div>
      </div>

      <div id="authAlert" aria-live="polite"></div>

      <div class="tabs" role="tablist" aria-label="Log in or sign up">
        <button type="button" class="tab" role="tab" id="tab-login" aria-selected="true" aria-controls="panel-login">Log In</button>
        <button type="button" class="tab" role="tab" id="tab-signup" aria-selected="false" aria-controls="panel-signup" tabindex="-1">Sign Up</button>
      </div>

      <!-- LOG IN -->
      <section id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <form id="loginForm" class="form" novalidate>
          <div class="field">
            <label for="loginIc">IC number</label>
            <input class="input" id="loginIc" name="ic" type="text" inputmode="numeric" autocomplete="username" maxlength="14" placeholder="12 digits, with or without dashes" aria-describedby="loginIc-error">
            <p class="field__error" id="loginIc-error" hidden></p>
          </div>
          <div class="field">
            <label for="loginPin">PIN</label>
            <div class="input-group">
              <input class="input" id="loginPin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="4 to 6 digits" aria-describedby="loginPin-error">
              <button type="button" class="toggle" data-toggle="loginPin" aria-pressed="false" aria-label="Show PIN">Show</button>
            </div>
            <p class="field__error" id="loginPin-error" hidden></p>
          </div>
          <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Log In</button>
        </form>
      </section>

      <!-- SIGN UP -->
      <section id="panel-signup" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <form id="signupForm" class="form" novalidate>
          <div class="field">
            <label for="signupName">Full name</label>
            <input class="input" id="signupName" name="name" type="text" autocomplete="name" maxlength="100" aria-describedby="signupName-error">
            <p class="field__error" id="signupName-error" hidden></p>
          </div>
          <div class="field">
            <label for="signupIc">IC number</label>
            <input class="input" id="signupIc" name="ic" type="text" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="12 digits, with or without dashes" aria-describedby="signupIc-error icPreview">
            <p class="hint" id="icPreview" aria-live="polite"></p>
            <p class="field__error" id="signupIc-error" hidden></p>
          </div>
          <div class="field">
            <label for="signupPin">PIN</label>
            <div class="input-group">
              <input class="input" id="signupPin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="4 to 6 digits" aria-describedby="signupPin-error">
              <button type="button" class="toggle" data-toggle="signupPin signupPin2" aria-pressed="false" aria-label="Show PIN">Show</button>
            </div>
            <p class="field__error" id="signupPin-error" hidden></p>
          </div>
          <div class="field">
            <label for="signupPin2">Confirm PIN</label>
            <input class="input" id="signupPin2" name="pin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" aria-describedby="signupPin2-error">
            <p class="field__error" id="signupPin2-error" hidden></p>
          </div>
          <button type="submit" class="btn btn--primary btn--block" id="signupBtn">Create Account</button>
        </form>
      </section>

      <p class="foot">Record blood pressure and oximeter readings at home.</p>
      <noscript><p class="foot">Please turn on JavaScript to use PANTaU.</p></noscript>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="index.js"></script>
</body>
</html>
